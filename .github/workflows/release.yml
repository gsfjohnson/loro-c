name: release

on:
  release:
    types: [published]
  workflow_dispatch:

# gh release upload needs write access to the repo's releases.
permissions:
  contents: write

# Release builds across the three supported platforms. Each job:
#   1. Configures + builds + runs the test suite (BUILD_TESTING=ON) in Release.
#   2. Installs to a job-local prefix.
#   3. Builds the standalone find_package consumer against the install tree,
#      confirming loroConfig + loro-targets resolve and the static link list is
#      complete (pkg-config path additionally verified on Linux).
#   4. Packages the install tree (.tar.gz on Linux/macOS, .zip on Windows).
#   5. Uploads it as a run artifact, and — when triggered by a published
#      release — attaches it to the GitHub Release.
#
# Unlike ../loro-cpp this repo has no CPack/packaging setup, so the install
# tree is archived directly. Windows uses the GitHub runner's native MSVC
# toolchain via the default Corrosion path (the same path ci.yml exercises);
# the dev-box MSYS2/CLANG64 gnullvm workaround is not needed here because the
# hosted runner has a working link.exe.
#
# The build-ios job below adds three cross-compiled iOS slices (device arm64,
# simulator arm64, simulator x86_64) as separate per-slice tarballs (issue #5;
# no xcframework). iOS binaries cannot execute on the runner, so those jobs
# build with BUILD_TESTING=OFF and validate via (a) lipo/otool arch + platform
# checks on the installed archive and (b) a cross-configured *build* (no run)
# of tests/consumer against the install tree.
#
# The build-android job adds two Android ABIs (arm64-v8a, x86_64) the same way:
# per-ABI tarballs, BUILD_TESTING=OFF, archive checks with the NDK's llvm-readelf/nm,
# and a cross-built consumer linked at the minimum supported API level.

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned runner images (not *-latest) so the uploaded artifact names
          # stay stable across runs. These mirror ci.yml's matrix.
          - os: ubuntu-22.04
            artifact: linux-x86_64
          - os: macos-15
            artifact: macos-arm64
          # Intel (x86_64) macOS image — builds natively for x86_64-apple-darwin
          # via the default Corrosion path, same steps as the arm64 job above.
          - os: macos-15-intel
            artifact: macos-x86_64
          # Native MSVC toolchain (default Corrosion path). ABI-incompatible
          # with the gnullvm artifact built by the build-windows-gnullvm job
          # below — consumers pick the one matching their compiler.
          - os: windows-2022
            artifact: windows-x86_64-msvc

    env:
      # GitHub-expanded before any shell sees it, so this is shell-agnostic
      # (pwsh on Windows, bash on Linux/macOS). Native cmake on every runner
      # accepts this drive-letter / forward-slash path.
      INSTALL_DIR: ${{ github.workspace }}/install
      # Version stamp baked into the archive filenames (e.g. v0.1.4). On a
      # published release this is the tag; on a manual workflow_dispatch run
      # github.event.release.tag_name is empty, so fall back to the ref name
      # (the branch, e.g. "main").
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loro-c-api

      # CMAKE_BUILD_TYPE drives single-config generators (Make/Ninja on
      # Linux/macOS); --config drives the multi-config Visual Studio generator
      # on Windows. Passing both is the standard cross-generator pattern — each
      # ignores the one it doesn't use. (Same approach as ci.yml.)
      - name: Configure (Release)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DLORO_BUILD_EXAMPLES=ON
          -DCMAKE_INSTALL_PREFIX="${{ env.INSTALL_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release

      # The only real test of transitive static linkage: build a downstream
      # project against the install tree via find_package(loro), then run it.
      # Catches a missing system lib in the per-platform lists baked into
      # loroConfig.cmake.
      - name: Consumer find_package smoke test
        run: >
          cmake -S tests/consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.INSTALL_DIR }}" &&
          cmake --build build-consumer --config Release &&
          ctest --test-dir build-consumer -C Release --output-on-failure

      # pkg-config is the other supported discovery path; validate it on Linux.
      - name: Consumer pkg-config smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          export PKG_CONFIG_PATH="${{ env.INSTALL_DIR }}/lib/pkgconfig:${{ env.INSTALL_DIR }}/lib64/pkgconfig"
          pkg-config --exists loro
          echo "cflags: $(pkg-config --cflags loro)"
          echo "libs:   $(pkg-config --libs --static loro)"
          c++ -std=c++20 tests/consumer/main.cpp $(pkg-config --cflags loro) \
            $(pkg-config --libs --static loro) -o consumer_pc
          ./consumer_pc

      # ----- Package the install tree --------------------------------------
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar czf "loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz" -C "${{ env.INSTALL_DIR }}" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ env.INSTALL_DIR }}/*" -DestinationPath "loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.zip"

      # Run artifact: visible on the Actions run page (expires in 90 days).
      # Both patterns are listed; only the one matching this OS exists, which is
      # fine — upload-artifact only errors when *no* pattern matches.
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: loro-c-${{ matrix.artifact }}
          path: |
            loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz
            loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.zip
          if-no-files-found: error

      # Populate the Release page itself by attaching the same archive to the
      # release that triggered this workflow. Skipped on manual workflow_dispatch
      # runs (which still produce the run artifact above).
      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archive found to upload" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Second Windows artifact: the MSYS2/CLANG64 gnullvm build. ABI-compatible
  # with mingw/clang downstreams (the MSVC artifact from the build job is not).
  # This reproduces the local dev-box toolchain — gnullvm Rust host + CLANG64
  # clang + Ninja — and uses the manual cargo->CMake path (LORO_USE_CORROSION
  # =OFF), because Corrosion's absolute-path handling breaks under MSYS2's
  # POSIX cmake (see CMakeLists.txt:11-15 and cmake/BuildRustStaticlib.cmake).
  # It is a separate job rather than a matrix entry because the shell, toolchain
  # setup, and path handling diverge wholesale from the native jobs above.
  build-windows-gnullvm:
    name: windows-2022 (gnullvm)
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      # Version stamp baked into the archive filename (e.g. v0.1.4); see the
      # build job's env for the release-tag / ref-name fallback rationale.
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}

    defaults:
      run:
        shell: 'msys2 {0}'

    steps:
      - uses: actions/checkout@v4

      # path-type: inherit appends the Windows PATH after MSYS2's, so the shell
      # can see rustup's ~/.cargo/bin (added to the Windows PATH via $GITHUB_PATH
      # in "Expose rustup" below). cmake/ninja are pulled from the MSYS2 *base*
      # repo (msys/cmake, msys/ninja), NOT the mingw-prefixed CLANG64 packages:
      # the base-repo build reports CMAKE_HOST_SYSTEM_NAME == "MSYS" and consumes
      # POSIX paths, which is what the manual build path expects and matches the
      # dev box (where CMake's WIN32 is unset though the gnullvm target is
      # Windows). clang/pkgconf come from CLANG64 for the C/C++ layer + tests.
      - name: Setup MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            git
            cmake
            ninja
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-pkgconf

      # Installs rustup + stable and puts ~/.cargo/bin on the Windows PATH.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loro-c-api

      # The rustup toolchain isn't on the MSYS2 PATH by default. cygpath -u
      # converts $USERPROFILE (C:\Users\…) to MSYS form (/c/Users/…); embedding
      # the raw Windows path breaks $PATH because the drive-letter colon reads as
      # a PATH separator.
      - name: Expose rustup to MSYS2
        run: |
          CARGO_BIN="$(cygpath -u "$USERPROFILE")/.cargo/bin"
          echo "$CARGO_BIN" >> "$GITHUB_PATH"
          export PATH="$CARGO_BIN:$PATH"
          rustc --version
          cargo --version

      # The runner's default toolchain is msvc-host; install the gnullvm-host
      # toolchain that the manual build pins via LORO_RUST_TOOLCHAIN. With a
      # gnullvm host the build target == host, so std is present and linking goes
      # through the gnullvm (clang/lld) linker rather than MSVC link.exe.
      - name: Install gnullvm Rust toolchain
        run: rustup toolchain install --no-self-update stable-x86_64-pc-windows-gnullvm

      # MSYS2-base cmake does not treat D:\… (or D:/…) as absolute and would
      # double-nest the install tree; convert $GITHUB_WORKSPACE to MSYS form so
      # cmake sees /d/a/…. Exported for the configure/install/consumer steps.
      - name: Compute workspace paths
        run: echo "INSTALL_DIR=$(cygpath -u "${GITHUB_WORKSPACE}")/install" >> "${GITHUB_ENV}"

      # Manual path: gnullvm target + the gnullvm toolchain. cmake auto-detects
      # the CLANG64 clang/clang++ from PATH for the C/C++ layer and tests.
      - name: Configure (Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DLORO_BUILD_EXAMPLES=ON \
            -DLORO_USE_CORROSION=OFF \
            -DLORO_CARGO_TARGET=x86_64-pc-windows-gnullvm \
            -DLORO_RUST_TOOLCHAIN=stable-x86_64-pc-windows-gnullvm \
            -DCMAKE_INSTALL_PREFIX="${{ env.INSTALL_DIR }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build

      # find_package against the install tree exercises loro-manual-targets.cmake
      # (the relocatable IMPORTED archive) + the baked gnullvm system-lib list
      # (incl. libunwind). This is the real check that the packaged tree links.
      - name: Consumer find_package smoke test
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.INSTALL_DIR }}"
          cmake --build build-consumer --parallel
          ctest --test-dir build-consumer --output-on-failure

      # Package as .zip for parity with the MSVC artifact, via pwsh (avoids the
      # MSYS2 GNU-tar-can't-write-zip issue). The install tree is the same
      # physical dir as ${{ github.workspace }}/install — pwsh just addresses it
      # in Windows form.
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "${{ github.workspace }}/install/*" -DestinationPath "loro-c-windows-x86_64-gnullvm-${{ env.VERSION }}.zip"

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: loro-c-windows-x86_64-gnullvm
          path: loro-c-windows-x86_64-gnullvm-${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "loro-c-windows-x86_64-gnullvm-${{ env.VERSION }}.zip" --clobber

  # iOS cross builds (issue #5): three separate single-arch slices, packaged with the
  # same prefix layout as the host assets so downstream find_package(loro) works
  # unchanged. A separate job (not rows on `build`) because iOS binaries cannot run on
  # the runner: no ctest, BUILD_TESTING=OFF, and the consumer smoke test is build-only.
  # The install tree's only compiled artifact is the Rust staticlib (the C++ layer is
  # header-only), so no C/C++ cross toolchain beyond the SDK is exercised — but we still
  # configure CMake for iOS (CMAKE_SYSTEM_NAME=iOS) so the release job goes through
  # exactly what a consumer does. No bitcode (deprecated since Xcode 14; rustc stopped
  # emitting it long ago).
  build-ios:
    name: ios (${{ matrix.artifact }})
    runs-on: macos-15
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # min_os: rustc stamps each object's LC_BUILD_VERSION minos from the
          # IPHONEOS_DEPLOYMENT_TARGET env var (set below). aarch64-apple-ios-sim's
          # floor is iOS 14; the other two targets go down to 13.
          # platform_re: LC_BUILD_VERSION platform id asserted by "Verify archive
          # slice" — 2 = iOS device, 7 = iOS simulator (newer otool spells the name).
          - artifact: ios-arm64          # physical devices
            rust_target: aarch64-apple-ios
            sdk: iphoneos
            arch: arm64
            min_os: "13.0"
            platform_re: 'platform (2|IOS)$'
          - artifact: ios-sim-arm64      # simulator on Apple Silicon
            rust_target: aarch64-apple-ios-sim
            sdk: iphonesimulator
            arch: arm64
            min_os: "14.0"
            platform_re: 'platform (7|IOSSIMULATOR)$'
          # Known quirk (issue #5, downstream verification): rustup's prebuilt std for
          # x86_64-apple-ios stamps its ~295 archive members with old-style
          # LC_VERSION_MIN_IPHONEOS load commands instead of platform-7
          # LC_BUILD_VERSION (the target predates the split device/sim triples; only
          # nightly -Zbuild-std could rebuild them). loro's own objects are clean,
          # and ld64 links the mix silently — but do NOT tighten the platform
          # assertion below to *every* member, and expect possible platform-mismatch
          # warnings from newer linkers. The arm64-sim slice is unaffected.
          - artifact: ios-sim-x86_64     # simulator on Intel Macs
            rust_target: x86_64-apple-ios
            sdk: iphonesimulator
            arch: x86_64
            min_os: "13.0"
            platform_re: 'platform (7|IOSSIMULATOR)$'

    env:
      INSTALL_DIR: ${{ github.workspace }}/install
      # Version stamp baked into the archive filename (e.g. v1.13.7.2); see the build
      # job's env for the release-tag / ref-name fallback rationale.
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}
      # rustc reads this env var directly and stamps it into every object's minos.
      # CMAKE_OSX_DEPLOYMENT_TARGET only reaches the (header-only) C/C++ configure
      # checks, so this env var is what actually governs the shipped archive.
      IPHONEOS_DEPLOYMENT_TARGET: ${{ matrix.min_os }}

    steps:
      - uses: actions/checkout@v4

      # `targets:` pre-installs the cross std via rustup; Corrosion's FindRust fatally
      # errors if the requested Rust_CARGO_TARGET is not installed. llvm-tools
      # provides the llvm-objcopy used by "Strip embedded bitcode" below.
      - name: Install Rust (stable + iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: llvm-tools

      # All three slices run on the same runner image under the same job id, so the
      # per-slice `key` keeps their target/ caches from colliding.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loro-c-api
          key: ${{ matrix.artifact }}

      # Corrosion's FindRust has no Apple branch in its triple auto-derivation: without
      # an explicit Rust_CARGO_TARGET it would silently build the macOS *host* archive
      # (the "Verify archive slice" step below guards against exactly that). Default
      # generator (Unix Makefiles) on purpose — the Xcode generator drags in signing.
      # BUILD_TESTING=OFF because iOS test binaries cannot run here.
      - name: Configure (Release, iOS cross)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }}
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.min_os }}
          -DRust_CARGO_TARGET=${{ matrix.rust_target }}
          -DBUILD_TESTING=OFF
          -DLORO_BUILD_EXAMPLES=OFF
          -DCMAKE_INSTALL_PREFIX="${{ env.INSTALL_DIR }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      # Strip the inert bitcode that rustup's prebuilt std members carry (~250
      # objects with __LLVM,__bitcode/__cmdline sections — issue #5 observation;
      # from rustup's shipped std, not our build flags). ld64 never propagates it
      # into linked output (bitcode acceptance is gone since Xcode 14), so it is
      # pure archive dead weight. NOT `xcrun bitcode_strip`: on object-file
      # archives it shells out to ld with pre-ld-prime bitcode options that
      # Xcode 15+ rejects ("ld: file cannot be open()ed, errno=2 path=strip",
      # seen on Xcode 16.4 in run 31289399635). llvm-objcopy from rustup's
      # llvm-tools component (installed above) edits the archive directly, in
      # place, and is versioned with the toolchain rather than Xcode. The final
      # grep asserts the sections are actually gone. Deliberately placed BEFORE
      # the verify and consumer steps so the slice assertions and the downstream
      # link check run against the exact stripped archive that gets packaged.
      - name: Strip embedded bitcode
        run: |
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          LLVM_OBJCOPY="$(rustc --print sysroot)/lib/rustlib/${HOST}/bin/llvm-objcopy"
          A="${INSTALL_DIR}/lib/libloro_c_api.a"
          ls -l "$A"
          "$LLVM_OBJCOPY" --remove-section=__LLVM,__bitcode --remove-section=__LLVM,__cmdline "$A"
          ls -l "$A"
          if otool -l "$A" | grep -Eq 'sectname (__bitcode|__cmdline)'; then
            echo "bitcode sections still present after strip" >&2
            exit 1
          fi

      # Assert the installed archive is the right architecture AND the right Mach-O
      # platform — lipo alone cannot tell ios-arm64 from ios-sim-arm64. The otool dump
      # also surfaces the stamped minos in the log, so a rustc deployment-floor drift
      # is visible rather than silent.
      - name: Verify archive slice
        run: |
          lipo -info "${INSTALL_DIR}/lib/libloro_c_api.a"
          lipo -info "${INSTALL_DIR}/lib/libloro_c_api.a" | grep -q '${{ matrix.arch }}'
          otool -l "${INSTALL_DIR}/lib/libloro_c_api.a" | grep -A4 LC_BUILD_VERSION | head -30
          otool -l "${INSTALL_DIR}/lib/libloro_c_api.a" | grep -Eq '${{ matrix.platform_re }}'

      # Cross-configure + BUILD (no run) of the standalone consumer: proves loroConfig
      # resolves and an iOS link against the packaged archive completes. In addition to
      # CMAKE_PREFIX_PATH, CMAKE_FIND_ROOT_PATH is required: with CMAKE_SYSTEM_NAME=iOS,
      # CMake re-roots find_package searches under the SDK, so the install prefix must
      # itself be listed as a find root. (Also the documented consumer recipe — README.)
      - name: Consumer find_package cross-build check
        run: >
          cmake -S tests/consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }}
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.min_os }}
          -DCMAKE_PREFIX_PATH="${{ env.INSTALL_DIR }}"
          -DCMAKE_FIND_ROOT_PATH="${{ env.INSTALL_DIR }}" &&
          cmake --build build-consumer --parallel

      # Same install-tree tarball layout as the host assets; the tzf listing documents
      # the payload in the job log.
      - name: Package
        run: |
          tar czf "loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz" -C "${{ env.INSTALL_DIR }}" .
          tar tzf "loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz"

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: loro-c-${{ matrix.artifact }}
          path: loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz" --clobber

  # Android cross builds: one tarball per ABI, same prefix layout as the host assets so
  # find_package(loro) works unchanged under the NDK toolchain file. Separate job for the
  # same reason as build-ios: Android binaries cannot run on the runner, so
  # BUILD_TESTING=OFF and the consumer smoke test is build-only. Like iOS, the only
  # compiled artifact is the Rust staticlib, and no crate in the graph compiles C for
  # Android, so the NDK is only exercised by the CMake configure and the consumer link.
  build-android:
    name: android (${{ matrix.artifact }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # abi: the NDK's ANDROID_ABI name. machine: llvm-readelf's e_machine string,
          # asserted by "Verify archive" below.
          - artifact: android-arm64      # devices
            rust_target: aarch64-linux-android
            abi: arm64-v8a
            machine: AArch64
          - artifact: android-x86_64     # emulator on x86_64 hosts
            rust_target: x86_64-linux-android
            abi: x86_64
            machine: Advanced Micro Devices X86-64

    env:
      INSTALL_DIR: ${{ github.workspace }}/install
      # Version stamp baked into the archive filename; see the build job's env.
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}
      # The API level the archive is verified against: Basu Notes' minimum (Android 16).
      # The archive itself carries no API stamp (rustc's Android std resolves newer
      # libc symbols weakly), so it links into apps at any level the NDK supports; this
      # pins the level the consumer link check proves.
      ANDROID_API: "36"
      # Pinned NDK. r30 is the first release whose sysroot goes past API 35 (r28 and r29
      # cap at 35, and the NDK toolchain file only warns before clamping a higher
      # ANDROID_PLATFORM down). Downloaded by checksum rather than taken from the
      # runner image, whose preinstalled NDK set changes without notice.
      NDK_VERSION: r30
      NDK_SHA1: 5107f898313790e449e87eee2183d9a20602dee9

    steps:
      - uses: actions/checkout@v4

      # `targets:` pre-installs the cross std; Corrosion's FindRust errors if the
      # requested Rust_CARGO_TARGET is not installed.
      - name: Install Rust (stable + Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Both ABIs run on the same image under the same job id; the per-ABI key keeps
      # their target/ caches apart.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loro-c-api
          key: ${{ matrix.artifact }}

      # Fails here, not with a silent clamp later, if the pinned NDK lacks the API level.
      - name: Install Android NDK
        run: |
          curl -sSfLo ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "${NDK_SHA1}  ndk.zip" | sha1sum -c
          unzip -q ndk.zip -d "${RUNNER_TEMP}"
          rm ndk.zip
          NDK="${RUNNER_TEMP}/android-ndk-${NDK_VERSION}"
          test -f "${NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.rust_target }}/${ANDROID_API}/libc.so"
          echo "ANDROID_NDK=${NDK}" >> "${GITHUB_ENV}"

      # Explicit Rust_CARGO_TARGET even though Corrosion can derive it from ANDROID_ABI:
      # it is the key cmake/LoroSystemLibs.cmake classifies, and it matches the iOS jobs.
      # BUILD_TESTING=OFF because Android test binaries cannot run here.
      - name: Configure (Release, Android cross)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-${ANDROID_API}
          -DRust_CARGO_TARGET=${{ matrix.rust_target }}
          -DBUILD_TESTING=OFF
          -DLORO_BUILD_EXAMPLES=OFF
          -DCMAKE_INSTALL_PREFIX="${{ env.INSTALL_DIR }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      # Machine type alone cannot tell the x86_64 Android archive from an x86_64 glibc
      # host build (the failure mode if the target were ever dropped), so also assert a
      # bionic marker: Rust's Android std reaches errno through `__errno`, where glibc's
      # uses `__errno_location`. Tool output goes to files first: under the runner's
      # `bash -eo pipefail`, `tool | grep -q` can fail on SIGPIPE.
      - name: Verify archive
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          BIN="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          A="${INSTALL_DIR}/lib/libloro_c_api.a"
          ls -l "$A"
          "$BIN/llvm-readelf" -h "$A" > "${RUNNER_TEMP}/readelf.txt"
          awk -v want="$MACHINE" '/Machine:/ { n++; sub(/^ *Machine: */, ""); if ($0 != want) bad++ }
            END { printf "%d members, %d not %s\n", n, bad, want; exit !(n > 0 && bad == 0) }' \
            "${RUNNER_TEMP}/readelf.txt"
          "$BIN/llvm-nm" -u "$A" > "${RUNNER_TEMP}/undef.txt" 2>/dev/null
          grep -qw '__errno' "${RUNNER_TEMP}/undef.txt"
          if grep -qw '__errno_location' "${RUNNER_TEMP}/undef.txt"; then
            echo "archive references glibc's __errno_location: not an Android build" >&2
            exit 1
          fi

      # Cross-configure + BUILD (no run) of the standalone consumer at the pinned API
      # level: proves loroConfig resolves under the NDK toolchain and that its baked
      # system-lib list is complete for a real Android link. CMAKE_FIND_ROOT_PATH is
      # needed alongside CMAKE_PREFIX_PATH because the NDK toolchain file restricts
      # find_package to the find roots (also the documented recipe — README).
      - name: Consumer find_package cross-build check
        run: >
          cmake -S tests/consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-${ANDROID_API}
          -DCMAKE_PREFIX_PATH="${{ env.INSTALL_DIR }}"
          -DCMAKE_FIND_ROOT_PATH="${{ env.INSTALL_DIR }}" &&
          cmake --build build-consumer --parallel

      - name: Package
        run: |
          tar czf "loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz" -C "${{ env.INSTALL_DIR }}" .
          tar tzf "loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz"

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: loro-c-${{ matrix.artifact }}
          path: loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "loro-c-${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz" --clobber
